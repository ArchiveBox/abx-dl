name: Documentation tests

on:
  schedule:
    - cron: '13 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  USE_COLOR: 'False'
  UV_NO_SOURCES: '1'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      key: ${{ steps.check.outputs.key }}
    steps:
      - id: check
        uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main

  documentation:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: Documentation code blocks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.6"
          enable-cache: false

      - name: Project host CI tools through abxpkg
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/runtime-abx-lib
        run: |
          set -Eeuo pipefail
          ABXPKG_SPEC="$(uv run --no-cache --no-project python -c 'import tomllib; package = next(item for item in tomllib.load(open("uv.lock", "rb"))["package"] if item["name"] == "abxpkg"); wheel = package["wheels"][0]; print("abxpkg @ {}#{}".format(wheel["url"], wheel["hash"].replace(":", "=")))')"
          test -n "$ABXPKG_SPEC"
          uv run --no-cache --no-project --with "$ABXPKG_SPEC" abxpkg env --install \
            --lib="$ABXPKG_LIB_DIR" \
            --deps-from="$GITHUB_WORKSPACE/.github/configs/ci-tooling.json:orchestration_binaries" \
            --deps-from="$GITHUB_WORKSPACE/.github/configs/ci-tooling.json:docker_binaries" >> "$GITHUB_ENV"
          echo "$ABXPKG_LIB_DIR/env/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: '"${UV_BINARY}" sync --no-cache --locked --dev --no-sources'

      - name: Run documentation code blocks
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/runtime-abx-lib
          ABX_DL_DOCS_OUTPUT_DIR: ${{ runner.temp }}/abx-dl-docs-output
        run: |
          mkdir -p "$ABX_DL_DOCS_OUTPUT_DIR"
          $UV_BINARY run --no-cache --no-sync --no-sources pytest -vv --tb=long --durations=0 -m "not docker_required" README.md AGENTS.md CLAUDE.md skills

      - name: Test Docker documentation commands
        run: |
          set -Eeuo pipefail
          export ABXDL_IMAGE="archivebox/abx-dl:sha-${GITHUB_SHA::12}"
          "${DOCKER_BINARY}" pull "$ABXDL_IMAGE"
          test "$("${DOCKER_BINARY}" image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ABXDL_IMAGE")" = "$GITHUB_SHA"
          $UV_BINARY run --no-cache --no-sync --no-sources pytest -vv --tb=long -m docker_required README.md AGENTS.md CLAUDE.md skills

      - name: Upload failed README crawl
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-failure
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/abx-dl-docs-output/failure.log
            ${{ runner.temp }}/abx-dl-docs-output/stdout.log
            ${{ runner.temp }}/abx-dl-docs-output/stderr.log
            ${{ runner.temp }}/abx-dl-docs-output/index.jsonl
            ${{ runner.temp }}/abx-dl-docs-output/dom/output.html
            ${{ runner.temp }}/abx-dl-docs-output/readability/

  complete:
    name: 'Scheduled inputs: ${{ needs.changes.outputs.key }}'
    needs: [changes, documentation]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled work completed successfully.'
