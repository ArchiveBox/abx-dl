name: Docker

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_IMAGE: archivebox/abx-dl
  GHCR_IMAGE: ghcr.io/archivebox/abx-dl
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  docker:
    name: Docker build and test
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/docker.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      push_digests: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    secrets: inherit

  publish-manifest:
    name: Publish tested multiarch image
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    needs: docker
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the released commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.6"
          enable-cache: false

      - name: Project host release tools through abxpkg
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/abx-lib
          PYTHON_BINARY: ${{ env.pythonLocation }}/bin/python
        run: |
          set -Eeuo pipefail
          ABXPKG_VERSION="$(uv run --no-cache --no-project python -c 'import tomllib; print(next(package["version"] for package in tomllib.load(open("uv.lock", "rb"))["package"] if package["name"] == "abxpkg"))')"
          test -n "$ABXPKG_VERSION"
          echo "ABXPKG_LIB_DIR=$ABXPKG_LIB_DIR" >> "$GITHUB_ENV"
          uv run --no-cache --no-project --with "abxpkg==$ABXPKG_VERSION" abxpkg env --install \
            --lib="$ABXPKG_LIB_DIR" \
            --deps-from="$GITHUB_WORKSPACE/.github/configs/ci-tooling.json:orchestration_binaries" >> "$GITHUB_ENV"
          echo "$ABXPKG_LIB_DIR/env/bin" >> "$GITHUB_PATH"

      - name: Resolve Docker through abxpkg
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/abx-lib
        run: |
          set -Eeuo pipefail
          ABXPKG_VERSION="$(uv run --no-cache --no-project python -c 'import tomllib; print(next(package["version"] for package in tomllib.load(open("uv.lock", "rb"))["package"] if package["name"] == "abxpkg"))')"
          test -n "$ABXPKG_VERSION"
          echo "ABXPKG_LIB_DIR=$ABXPKG_LIB_DIR" >> "$GITHUB_ENV"
          uv run --no-cache --no-project --with "abxpkg==$ABXPKG_VERSION" abxpkg env --install \
            --lib="$ABXPKG_LIB_DIR" \
            --deps-from="$GITHUB_WORKSPACE/.github/configs/ci-tooling.json:docker_binaries" >> "$GITHUB_ENV"
          echo "$ABXPKG_LIB_DIR/env/bin" >> "$GITHUB_PATH"
          docker_binary="$ABXPKG_LIB_DIR/env/bin/docker"
          test -L "$docker_binary"
          test -x "$docker_binary"
          "$docker_binary" --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.2

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download exact tested image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Collect release tags
        id: docker_meta
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$("${UV_BINARY}" run --no-cache --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          SHORT_SHA="${RELEASE_SHA::12}"
          TAG="v${VERSION}"
          tag_output="$("${GIT_BINARY}" ls-remote origin "refs/tags/${TAG}^{}")"
          tag_target="${tag_output%%[[:space:]]*}"
          if [[ -z "$tag_target" ]]; then
            tag_output="$("${GIT_BINARY}" ls-remote origin "refs/tags/${TAG}")"
            tag_target="${tag_output%%[[:space:]]*}"
          fi
          test "$tag_target" = "$RELEASE_SHA"

          {
            echo 'dockerhub_tags<<EOF'
            echo "${DOCKERHUB_IMAGE}:main"
            echo "${DOCKERHUB_IMAGE}:sha-${SHORT_SHA}"
            echo "${DOCKERHUB_IMAGE}:${VERSION}"
            if [[ "$VERSION" != *rc* ]]; then
              echo "${DOCKERHUB_IMAGE}:latest"
            fi
            echo 'EOF'
            echo 'ghcr_tags<<EOF'
            echo "${GHCR_IMAGE}:main"
            echo "${GHCR_IMAGE}:sha-${SHORT_SHA}"
            echo "${GHCR_IMAGE}:${VERSION}"
            if [[ "$VERSION" != *rc* ]]; then
              echo "${GHCR_IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify digest set
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t DIGESTS < <("${UV_BINARY}" run --no-cache --no-project python -c 'from pathlib import Path; print("\n".join(sorted(path.name for path in Path("/tmp/digests").iterdir() if path.is_file())))')
          [[ "${#DIGESTS[@]}" -eq 2 ]]
          for digest in "${DIGESTS[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done

      - name: Create Docker Hub manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t DIGESTS < <("${UV_BINARY}" run --no-cache --no-project python -c 'from pathlib import Path; print("\n".join(sorted(path.name for path in Path("/tmp/digests").iterdir() if path.is_file())))')
          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && TAG_ARGS+=(--tag "$tag")
          done <<< "${{ steps.docker_meta.outputs.dockerhub_tags }}"
          REFS=()
          for digest in "${DIGESTS[@]}"; do
            REFS+=("${DOCKERHUB_IMAGE}@sha256:${digest}")
          done
          "${DOCKER_BINARY}" buildx imagetools create "${TAG_ARGS[@]}" "${REFS[@]}"

      - name: Create GHCR manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t DIGESTS < <("${UV_BINARY}" run --no-cache --no-project python -c 'from pathlib import Path; print("\n".join(sorted(path.name for path in Path("/tmp/digests").iterdir() if path.is_file())))')
          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && TAG_ARGS+=(--tag "$tag")
          done <<< "${{ steps.docker_meta.outputs.ghcr_tags }}"
          REFS=()
          for digest in "${DIGESTS[@]}"; do
            REFS+=("${GHCR_IMAGE}@sha256:${digest}")
          done
          "${DOCKER_BINARY}" buildx imagetools create "${TAG_ARGS[@]}" "${REFS[@]}"
