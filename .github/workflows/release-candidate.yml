name: Release candidate

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-candidate-main
  cancel-in-progress: false

jobs:
  python-artifacts:
    name: Prepare, build, and smoke-test release artifacts
    runs-on: ubuntu-24.04
    outputs:
      action: ${{ steps.version.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GH_TOKEN }}

      - id: version
        uses: ArchiveBox/monorepo/.github/actions/prepare-release-version@88995501da28f05fdac2df2fab235cd79cd92a3f
        with:
          package: abx-dl
          branch: main
          tag-prefix: v
          version-scheme: patch

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.6"
          enable-cache: false
      - name: Build and smoke-test the wheel
        if: steps.version.outputs.action == 'ready' || steps.version.outputs.action == 'reserved'
        shell: bash
        run: |
          set -Eeuo pipefail
          uv build --no-cache --no-sources --out-dir dist --clear
          wheel=(dist/abx_dl-*.whl)
          uv sync --locked --no-cache --no-sources --no-dev --no-install-project
          uv pip install --no-cache --no-deps --python .venv/bin/python "${wheel[0]}"
          smoke_dir="$(mktemp -d)"
          (cd "$smoke_dir" && VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" uv run --no-cache --active --no-project python -c 'import abx_dl')
          (cd "$smoke_dir" && VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" uv run --no-cache --active --no-project abx-dl --version)
          uv run --no-cache --no-project python - <<'PY' > dist/SHA256SUMS
          from hashlib import sha256
          from pathlib import Path
          for path in sorted((*Path("dist").glob("*.whl"), *Path("dist").glob("*.tar.gz"))):
              print(f"{sha256(path.read_bytes()).hexdigest()}  {path.name}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version.outputs.action == 'ready' || steps.version.outputs.action == 'reserved'
        with:
          name: python-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  docker-digests:
    needs: python-artifacts
    if: needs.python-artifacts.outputs.action == 'ready' || needs.python-artifacts.outputs.action == 'reserved'
    uses: ./.github/workflows/docker.yml
    with:
      checkout_ref: ${{ github.sha }}
      push_digests: true
      full_tests: false
    secrets: inherit
