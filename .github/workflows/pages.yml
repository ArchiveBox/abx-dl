name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: >-
        pages-build-${{ github.event_name == 'workflow_dispatch' &&
        github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Build website from README
        run: uv run bin/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      # Cancel stale builds, but never interrupt a submitted Pages deployment.
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
